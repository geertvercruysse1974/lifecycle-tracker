<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infrastructure Lifecycle Tracker</title>
<style>
:root{
  --bg:#f4f6f8; --surface:#fff; --text:#111827; --muted:#6b7280; --border:#e5e7eb;
  --header:#1f2937; --primary:#2563eb; --primary-h:#1d4ed8;
  --green:#16a34a; --orange:#ea580c; --red:#dc2626;
  --shadow:0 2px 5px rgba(0,0,0,.1);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f172a; --surface:#1e293b; --text:#f1f5f9; --muted:#94a3b8; --border:#334155;
    --header:#020617; --shadow:0 2px 5px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text);margin:0}
header{background:var(--header);color:#fff;padding:20px}
header h1{margin:0 0 4px}
header p{margin:0;opacity:.8}
.container{max-width:1300px;margin:auto;padding:20px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:20px}
.card{background:var(--surface);border-radius:10px;padding:18px 20px;box-shadow:var(--shadow);
  border:2px solid transparent;cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%}
.card:hover{border-color:var(--border)}
.card.active{border-color:var(--primary)}
.card h2{margin:0;font-size:32px}
.card p{margin:4px 0 0;color:var(--muted)}
.green{color:var(--green)} .orange{color:var(--orange)} .red{color:var(--red)}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:15px}
.toolbar input,.toolbar select{padding:10px;border:1px solid var(--border);border-radius:6px;
  background:var(--surface);color:var(--text);font:inherit}
.toolbar .search{flex:1;min-width:200px}
.spacer{flex:1}

button,.btn{background:var(--primary);color:#fff;border:none;padding:10px 16px;border-radius:6px;
  cursor:pointer;font:inherit;display:inline-block}
button:hover,.btn:hover{background:var(--primary-h)}
button.secondary,.btn.secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}
button.secondary:hover,.btn.secondary:hover{background:var(--bg)}
button.danger{background:var(--red)}
button.small{padding:5px 10px;font-size:13px}

.table-wrap{overflow-x:auto;background:var(--surface);border-radius:10px;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse}
th{background:var(--header);color:#fff;user-select:none;white-space:nowrap}
th.sortable{cursor:pointer}
th.sortable:hover{background:#374151}
th,td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}
tr:last-child td{border-bottom:none}
td.num{white-space:nowrap}
td.actions{white-space:nowrap;text-align:right}
.sub{display:block;color:var(--muted);font-size:12px}
.empty{padding:40px;text-align:center;color:var(--muted)}

.status{padding:5px 10px;border-radius:6px;color:#fff;font-weight:bold;font-size:13px;white-space:nowrap}
.status.green{background:var(--green);color:#fff}
.status.orange{background:var(--orange);color:#fff}
.status.red{background:var(--red);color:#fff}

dialog{border:none;border-radius:12px;padding:0;width:min(560px,94vw);background:var(--surface);color:var(--text);
  box-shadow:0 10px 40px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog form{padding:22px}
dialog h2{margin-top:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid .full{grid-column:1/-1}
label{font-size:14px;font-weight:bold}
dialog input,dialog select,dialog textarea{width:100%;padding:10px;margin:5px 0 14px;border:1px solid var(--border);
  border-radius:6px;background:var(--bg);color:var(--text);font:inherit}
.dialog-actions{display:flex;gap:10px;justify-content:flex-end}
.warn{color:var(--orange);font-size:13px;margin:-8px 0 12px;display:none}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--header);color:#fff;
  padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <h1>Infrastructure Lifecycle Tracker</h1>
  <p>Voor Dell, HPE, NetApp, VMware, Veeam en andere assets</p>
</header>

<div class="container">

  <div class="cards" id="cards">
    <button class="card active" data-filter="all"><h2 id="totalAssets">0</h2><p>Assets</p></button>
    <button class="card" data-filter="supported"><h2 class="green" id="supported">0</h2><p>Onder support</p></button>
    <button class="card" data-filter="expiring"><h2 class="orange" id="expiring">0</h2><p id="expiringLabel">Vervalt binnen 90 dagen</p></button>
    <button class="card" data-filter="expired"><h2 class="red" id="expired">0</h2><p>Verlopen</p></button>
  </div>

  <div class="toolbar">
    <input class="search" type="search" id="search" placeholder="Zoek op hostname, model, serial, locatie, eigenaar…">
    <select id="vendorFilter"><option value="">Alle vendors</option></select>
    <label for="threshold" style="font-weight:normal">Waarschuwing:</label>
    <select id="threshold">
      <option value="30">30 dagen</option>
      <option value="60">60 dagen</option>
      <option value="90" selected>90 dagen</option>
      <option value="180">180 dagen</option>
      <option value="365">365 dagen</option>
    </select>
    <span class="spacer"></span>
    <button id="addBtn">+ Asset toevoegen</button>
    <button class="secondary" id="exportBtn">Export CSV</button>
    <label class="btn secondary" style="font-weight:normal">Import CSV
      <input type="file" id="importFile" accept=".csv,text/csv" hidden>
    </label>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="sortable" data-sort="hostname">Hostname</th>
          <th class="sortable" data-sort="vendor">Vendor</th>
          <th class="sortable" data-sort="model">Model</th>
          <th class="sortable" data-sort="serial">Serial</th>
          <th class="sortable" data-sort="location">Locatie / Eigenaar</th>
          <th class="sortable" data-sort="warranty">Warranty tot</th>
          <th class="sortable" data-sort="days">Resterend</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="assetTable"></tbody>
    </table>
    <div class="empty" id="empty" hidden>Geen assets gevonden.</div>
  </div>
</div>

<dialog id="dialog">
  <form id="assetForm" method="dialog">
    <h2 id="dialogTitle">Asset toevoegen</h2>
    <div class="grid">
      <div>
        <label for="hostname">Hostname *</label>
        <input type="text" id="hostname" required>
      </div>
      <div>
        <label for="vendor">Vendor</label>
        <select id="vendor">
          <option>Dell</option><option>HPE</option><option>NetApp</option>
          <option>VMware</option><option>Veeam</option><option>Andere</option>
        </select>
      </div>
      <div>
        <label for="model">Model</label>
        <input type="text" id="model">
      </div>
      <div>
        <label for="serial">Serienummer</label>
        <input type="text" id="serial">
      </div>
      <div class="full warn" id="dupWarn">Let op: dit serienummer bestaat al in de lijst.</div>
      <div>
        <label for="location">Locatie</label>
        <input type="text" id="location" placeholder="bv. DC1 – Rack 12">
      </div>
      <div>
        <label for="owner">Eigenaar / klant</label>
        <input type="text" id="owner">
      </div>
      <div class="full">
        <label for="warranty">Warranty einddatum *</label>
        <input type="date" id="warranty" required>
      </div>
      <div class="full">
        <label for="notes">Notities</label>
        <textarea id="notes" rows="3" placeholder="Contractnummer, verlengingsstatus, …"></textarea>
      </div>
    </div>
    <div class="dialog-actions">
      <button type="button" class="secondary" id="cancelBtn">Annuleren</button>
      <button type="submit">Opslaan</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const STORE = 'assets';
const SETTINGS = 'assetSettings';

let assets = load(STORE, []);
let settings = Object.assign({threshold: 90}, load(SETTINGS, {}));
let state = {filter:'all', sortKey:'warranty', sortDir:1, editId:null};

// migrate old data: give everything an id + new fields
assets = assets.map(a => Object.assign(
  {id: uid(), hostname:'', vendor:'Andere', model:'', serial:'', location:'', owner:'', notes:'', warranty:''}, a));

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function load(key, fallback){
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
  catch(e){ return fallback; }
}
function save(){
  try {
    localStorage.setItem(STORE, JSON.stringify(assets));
    localStorage.setItem(SETTINGS, JSON.stringify(settings));
  } catch(e){ toast('Opslaan in de browser is mislukt'); }
}

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---- dates (local time, no timezone drift) ----
function parseDate(str){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str || '');
  return m ? new Date(+m[1], +m[2]-1, +m[3]) : null;
}
function daysLeft(str){
  const d = parseDate(str);
  if(!d) return null;
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((d - t) / 86400000);
}
function getStatus(days){
  if(days === null || days < 0) return 'expired';
  if(days <= settings.threshold) return 'expiring';
  return 'supported';
}
const STATUS_UI = {
  supported:{label:'Actief', css:'green'},
  expiring:{label:'Binnenkort', css:'orange'},
  expired:{label:'Verlopen', css:'red'}
};
function remaining(days){
  if(days === null) return '—';
  if(days < 0) return `${-days} d verlopen`;
  if(days === 0) return 'Vandaag';
  if(days >= 365) return `${(days/365).toFixed(1).replace('.', ',')} jaar`;
  return `${days} d`;
}
function fmtDate(str){
  const d = parseDate(str);
  return d ? d.toLocaleDateString('nl-BE', {day:'2-digit', month:'2-digit', year:'numeric'}) : '—';
}

// ---- render ----
function enriched(){
  return assets.map(a => {
    const days = daysLeft(a.warranty);
    return Object.assign({}, a, {days, status:getStatus(days)});
  });
}

function render(){
  const all = enriched();

  // counters (always on the full set)
  $('totalAssets').textContent = all.length;
  $('supported').textContent = all.filter(a => a.status==='supported').length;
  $('expiring').textContent = all.filter(a => a.status==='expiring').length;
  $('expired').textContent = all.filter(a => a.status==='expired').length;
  $('expiringLabel').textContent = `Vervalt binnen ${settings.threshold} dagen`;
  document.querySelectorAll('.card').forEach(c =>
    c.classList.toggle('active', c.dataset.filter === state.filter));

  // vendor dropdown
  const vf = $('vendorFilter'), cur = vf.value;
  const vendors = [...new Set(all.map(a => a.vendor).filter(Boolean))].sort();
  vf.innerHTML = '<option value="">Alle vendors</option>' +
    vendors.map(v => `<option>${esc(v)}</option>`).join('');
  vf.value = vendors.includes(cur) ? cur : '';

  // filters
  const q = $('search').value.trim().toLowerCase();
  let rows = all.filter(a =>
    (state.filter === 'all' || a.status === state.filter) &&
    (!vf.value || a.vendor === vf.value) &&
    (!q || [a.hostname,a.vendor,a.model,a.serial,a.location,a.owner,a.notes]
            .join(' ').toLowerCase().includes(q)));

  // sort
  const k = state.sortKey, dir = state.sortDir;
  rows.sort((a,b) => {
    let x = a[k], y = b[k];
    if(k === 'days'){ x = a.days ?? 1e9; y = b.days ?? 1e9; }
    if(k === 'warranty'){ x = a.warranty || '9999'; y = b.warranty || '9999'; }
    if(typeof x === 'string') return x.localeCompare(y, 'nl', {numeric:true}) * dir;
    return (x - y) * dir;
  });

  document.querySelectorAll('th.sortable').forEach(th => {
    const base = th.textContent.replace(/ [▲▼]$/, '');
    th.textContent = base + (th.dataset.sort === k ? (dir === 1 ? ' ▲' : ' ▼') : '');
  });

  $('assetTable').innerHTML = rows.map(a => {
    const ui = STATUS_UI[a.status];
    return `
    <tr>
      <td><strong>${esc(a.hostname)}</strong>${a.notes ? `<span class="sub" title="${esc(a.notes)}">📝 ${esc(a.notes.slice(0,40))}${a.notes.length>40?'…':''}</span>`:''}</td>
      <td>${esc(a.vendor)}</td>
      <td>${esc(a.model)}</td>
      <td>${esc(a.serial)}</td>
      <td>${esc(a.location) || '—'}${a.owner ? `<span class="sub">${esc(a.owner)}</span>` : ''}</td>
      <td class="num">${fmtDate(a.warranty)}</td>
      <td class="num ${ui.css}">${remaining(a.days)}</td>
      <td><span class="status ${ui.css}">${ui.label}</span></td>
      <td class="actions">
        <button class="small secondary" data-edit="${esc(a.id)}">Bewerk</button>
        <button class="small danger" data-del="${esc(a.id)}">✕</button>
      </td>
    </tr>`;
  }).join('');

  $('empty').hidden = rows.length > 0;
  $('empty').textContent = all.length ? 'Geen assets gevonden voor deze filter.'
                                      : 'Nog geen assets. Klik op "+ Asset toevoegen" om te starten.';
}

// ---- dialog / CRUD ----
const dlg = $('dialog');
const fields = ['hostname','vendor','model','serial','location','owner','warranty','notes'];

function openDialog(id){
  state.editId = id || null;
  const a = id ? assets.find(x => x.id === id) : null;
  $('dialogTitle').textContent = a ? 'Asset bewerken' : 'Asset toevoegen';
  fields.forEach(f => $(f).value = a ? (a[f] ?? '') : (f === 'vendor' ? 'Dell' : ''));
  if(a && ![...$('vendor').options].some(o => o.value === a.vendor)){
    $('vendor').add(new Option(a.vendor, a.vendor)); $('vendor').value = a.vendor;
  }
  checkDup();
  dlg.showModal();
  $('hostname').focus();
}
function checkDup(){
  const s = $('serial').value.trim().toLowerCase();
  const dup = s && assets.some(a => a.id !== state.editId && (a.serial||'').trim().toLowerCase() === s);
  $('dupWarn').style.display = dup ? 'block' : 'none';
}

$('serial').addEventListener('input', checkDup);
$('addBtn').onclick = () => openDialog();
$('cancelBtn').onclick = () => dlg.close();

$('assetForm').addEventListener('submit', e => {
  e.preventDefault();
  const data = {};
  fields.forEach(f => data[f] = $(f).value.trim());
  if(state.editId){
    Object.assign(assets.find(a => a.id === state.editId), data);
    toast('Asset bijgewerkt');
  } else {
    assets.push(Object.assign({id: uid()}, data));
    toast('Asset toegevoegd');
  }
  save(); dlg.close(); render();
});

$('assetTable').addEventListener('click', e => {
  const ed = e.target.closest('[data-edit]'), del = e.target.closest('[data-del]');
  if(ed) openDialog(ed.dataset.edit);
  if(del){
    const a = assets.find(x => x.id === del.dataset.del);
    if(a && confirm(`"${a.hostname}" verwijderen?`)){
      assets = assets.filter(x => x.id !== a.id);
      save(); render(); toast('Asset verwijderd');
    }
  }
});

// ---- filters / sorting ----
document.querySelectorAll('.card').forEach(c =>
  c.addEventListener('click', () => { state.filter = c.dataset.filter; render(); }));
$('search').addEventListener('input', render);
$('vendorFilter').addEventListener('change', render);
$('threshold').value = String(settings.threshold);
$('threshold').addEventListener('change', e => {
  settings.threshold = +e.target.value; save(); render();
});
document.querySelectorAll('th.sortable').forEach(th =>
  th.addEventListener('click', () => {
    const k = th.dataset.sort;
    if(state.sortKey === k) state.sortDir *= -1; else { state.sortKey = k; state.sortDir = 1; }
    render();
  }));

// ---- CSV export / import (semicolon, Excel-friendly) ----
const CSV_COLS = ['hostname','vendor','model','serial','location','owner','warranty','notes'];

function csvCell(v){
  v = String(v ?? '');
  return /[";\n\r]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
}
$('exportBtn').onclick = () => {
  const lines = [CSV_COLS.join(';')].concat(
    assets.map(a => CSV_COLS.map(c => csvCell(a[c])).join(';')));
  const blob = new Blob(['\ufeff' + lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `assets-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
};

function parseCSV(text){
  text = text.replace(/^\ufeff/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const delim = (first.match(/;/g)||[]).length >= (first.match(/,/g)||[]).length ? ';' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){
      if(c === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if(c === '"') q = true;
    else if(c === delim){ row.push(cell); cell = ''; }
    else if(c === '\n' || c === '\r'){
      if(c === '\r' && text[i+1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    } else cell += c;
  }
  if(cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}
function normDate(s){
  s = (s || '').trim();
  let m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = /^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/.exec(s);   // dd/mm/yyyy
  return m ? `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}` : '';
}
$('importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if(!file) return;
  const rows = parseCSV(await file.text());
  if(rows.length < 2){ toast('Geen rijen gevonden in CSV'); return; }
  const head = rows[0].map(h => h.trim().toLowerCase());
  if(!head.includes('hostname')){ toast('CSV mist een "hostname"-kolom'); return; }
  let added = 0, updated = 0, skipped = 0;
  rows.slice(1).forEach(r => {
    const rec = {};
    head.forEach((h,i) => { if(CSV_COLS.includes(h)) rec[h] = (r[i] || '').trim(); });
    rec.warranty = normDate(rec.warranty);
    if(!rec.hostname || !rec.warranty){ skipped++; return; }
    const existing = rec.serial && assets.find(a => (a.serial||'').toLowerCase() === rec.serial.toLowerCase());
    if(existing){ Object.assign(existing, rec); updated++; }
    else { assets.push(Object.assign({id: uid(), vendor:'Andere', model:'', serial:'', location:'', owner:'', notes:''}, rec)); added++; }
  });
  save(); render();
  toast(`Import: ${added} nieuw, ${updated} bijgewerkt, ${skipped} overgeslagen`);
});

// ---- toast ----
let toastT;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800);
}

save();
render();
</script>
</body>
</html>
